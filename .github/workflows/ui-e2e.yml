name: UI browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium interactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Real browser suite
        run: npm run test:e2e
      - name: Failure report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
